<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kälteanlagen-Quest • Final V5</title>
    <style>
        /* ---------- GLOBAL ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #dce8f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .slide-wrapper {
            max-width: 1100px;
            width: 100%;
            min-height: 90vh;
            position: relative;
            background: #f0f6fc;
            border-radius: 56px;
            border: 1px solid #b8cfe0;
            box-shadow: 0 30px 60px -12px #8aaec8, inset 0 1px 0 #e8f2fa;
            padding: 28px 24px;
            transition: border-color 0.5s, box-shadow 0.5s;
            overflow: hidden;
        }
        .slide-wrapper.success {
            border-color: #4CAF50;
            box-shadow: 0 30px 60px -12px #81C784;
        }
        .slide-wrapper.final {
            border-color: #4a8ab8;
            box-shadow: 0 30px 60px -12px #4a8ab866;
        }

        /* ---------- HINTERGRUND ---------- */
        .bg-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 56px;
            background: linear-gradient(180deg, #dce8f2 0%, #c5d8e8 100%);
        }
        .bg-scene .wall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(180deg, #dce8f2 0%, #c8dae8 100%);
        }
        .bg-scene .wall .tiles {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: repeating-linear-gradient(90deg,
                    rgba(180, 200, 215, 0.3) 0px,
                    rgba(180, 200, 215, 0.3) 60px,
                    rgba(160, 185, 205, 0.2) 60px,
                    rgba(160, 185, 205, 0.2) 62px);
        }
        .bg-scene .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(180deg, #c8d8e5 0%, #b0c8d8 100%);
        }
        .bg-scene .floor .floor-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(#c8d8e5 0% 25%, #b8c8d8 0% 50%) 0 0 / 80px 80px;
            opacity: 0.15;
        }
        .bg-scene .table {
            position: absolute;
            bottom: 25%;
            left: 12%;
            width: 160px;
            height: 12px;
            background: #8a9aa8;
            border-radius: 8px;
            box-shadow: 0 4px 0 #6a7a88;
        }
        .bg-scene .table::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 25px;
            width: 8px;
            height: 40px;
            background: #7a8a98;
            border-radius: 0 0 4px 4px;
            box-shadow: 100px 0 0 #7a8a98;
        }
        .bg-scene .table2 {
            position: absolute;
            bottom: 30%;
            right: 15%;
            width: 120px;
            height: 10px;
            background: #8a9aa8;
            border-radius: 8px;
            box-shadow: 0 4px 0 #6a7a88;
        }
        .bg-scene .table2::after {
            content: '';
            position: absolute;
            bottom: -35px;
            left: 20px;
            width: 6px;
            height: 35px;
            background: #7a8a98;
            border-radius: 0 0 4px 4px;
            box-shadow: 70px 0 0 #7a8a98;
        }
        .bg-scene .broken-fridge {
            position: absolute;
            bottom: 30%;
            right: 38%;
            width: 90px;
            height: 130px;
            background: linear-gradient(180deg, #c8d8e5 0%, #b0c4d4 100%);
            border-radius: 12px 12px 8px 8px;
            border: 3px solid #8aa0b0;
            box-shadow: 0 8px 0 #6a8298, inset 0 0 0 6px #dce8f2;
            opacity: 0.5;
            transform: rotate(-3deg);
        }
        .bg-scene .broken-fridge::before {
            content: '⚠️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            opacity: 0.7;
        }
        .bg-scene .broken-fridge .door {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            background: linear-gradient(180deg, #dce8f2 0%, #c4d4e2 100%);
            border-radius: 6px;
            border: 2px solid #a0b8c8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-scene .broken-fridge .door::after {
            content: '❄️ E5';
            font-size: 1rem;
            font-weight: 700;
            color: #e53935;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        .technician {
            position: absolute;
            bottom: 28%;
            left: 45%;
            z-index: 5;
            font-size: 4.5rem;
            animation: techWalk 3s ease-in-out infinite alternate;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.1));
            pointer-events: none;
        }
        @keyframes techWalk {
            0% {
                transform: translateX(-8px) rotate(-2deg);
            }
            100% {
                transform: translateX(8px) rotate(2deg);
            }
        }
        .technician .tool {
            position: absolute;
            bottom: -8px;
            right: -18px;
            font-size: 1.6rem;
            animation: toolSwing 1.8s ease-in-out infinite;
        }
        @keyframes toolSwing {
            0%,
            100% {
                transform: rotate(-15deg);
            }
            50% {
                transform: rotate(15deg);
            }
        }

        /* ---------- INHALT ---------- */
        .slide-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: rgba(220, 235, 248, 0.92);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #b0c8da;
            color: #1a3a4a;
            font-size: 0.95rem;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .code-word-badge {
            background: #dce8f2;
            padding: 4px 20px;
            border-radius: 40px;
            letter-spacing: 8px;
            font-weight: 700;
            font-size: 1.3rem;
            color: #1a3a4a;
            border: 1px solid #b0c8da;
        }
        .sound-toggle-blue {
            background: #dce8f2;
            border: 1px solid #b0c8da;
            color: #0a2a3a;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
        }
        .sound-toggle-blue:hover {
            background: #c8dae8;
        }

        .slide-title {
            font-size: 1.8rem;
            color: #0a2a3a;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .slide-title .emoji-big {
            font-size: 2.5rem;
        }

        /* ====== СЛАЙД 0: ТЕЛЕФОН ====== */
        .call-container {
            background: rgba(220, 235, 248, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 24px 20px 28px;
            border: 2px solid #b0c8da;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        .phone-real-call {
            background: #0a0a1a;
            border-radius: 50px;
            padding: 16px 12px 20px;
            max-width: 340px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 0 0 2px #2a2a4a;
            border: 1px solid #3a3a5a;
        }
        .phone-real-call .phone-notch {
            background: #0a0a1a;
            border-radius: 20px 20px 0 0;
            padding: 8px 16px 4px;
            display: flex;
            justify-content: space-between;
            color: #6a6a8a;
            font-size: 0.65rem;
        }
        .phone-real-call .phone-notch .notch-center {
            width: 60px;
            height: 18px;
            background: #0a0a1a;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            margin-top: -2px;
        }
        .phone-real-call .phone-screen-call {
            background: #0a1a2a;
            border-radius: 0 0 40px 40px;
            padding: 20px 16px 24px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }
        .phone-real-call .phone-screen-call .caller-avatar {
            font-size: 4.5rem;
            animation: ringPhone 0.6s ease-in-out infinite alternate;
        }
        @keyframes ringPhone {
            0% {
                transform: rotate(-8deg);
            }
            100% {
                transform: rotate(8deg);
            }
        }
        .phone-real-call .phone-screen-call .caller-name {
            color: #e8e8ff;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .phone-real-call .phone-screen-call .caller-restaurant {
            color: #6a8aaa;
            font-size: 0.85rem;
        }
        .phone-real-call .phone-screen-call .call-status {
            color: #4fc3f7;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .phone-real-call .phone-screen-call .call-timer {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #4a6a8a;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }
        .phone-real-call .phone-screen-call .wave-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #4fc3f7, #4a8ab8, #4fc3f7);
            background-size: 200% 100%;
            animation: waveMove 1.5s ease-in-out infinite;
        }
        @keyframes waveMove {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }
        .phone-buttons {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            justify-content: center;
        }
        .phone-btn {
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            min-width: 120px;
        }
        .phone-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .phone-btn.answer {
            background: #4CAF50;
            color: white;
            box-shadow: 0 4px 0 #2e7d32;
        }
        .phone-btn.answer:hover:not(:disabled) {
            background: #43a047;
            transform: scale(1.02);
        }
        .phone-btn.answer:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #2e7d32;
        }

        .story-text {
            background: #e8f2fa;
            padding: 14px 20px;
            border-radius: 16px;
            border-left: 5px solid #4a8ab8;
            color: #0a2a3a;
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
            margin: 14px 0 10px;
            min-height: 50px;
        }
        .story-text .highlight {
            color: #c0392b;
            font-weight: 700;
        }
        .story-text .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #0a2a3a;
            animation: cursorBlink 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes cursorBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .start-btn-blue {
            background: #4a8ab8;
            border: none;
            padding: 14px 44px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #2a6a8a, 0 0 30px #4a8ab866;
            transition: 0.12s;
            margin: 6px auto 0;
            border: 1px solid #5a9ac8;
            display: inline-block;
        }
        .start-btn-blue:hover:not(:disabled) {
            transform: scale(1.03);
            background: #3a7aa8;
        }
        .start-btn-blue:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2a6a8a;
        }
        .start-btn-blue:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #2a6a8a;
        }

        /* ---------- STATION 1: DRAG & DROP с реальными картинками ---------- */
        .equipment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 12px 0;
        }
        .equipment-item {
            background: #e8f2fa;
            border-radius: 20px;
            padding: 16px;
            border: 2px solid #b0c8da;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .equipment-item .eq-image {
            width: 100%;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #f5f9fc;
            padding: 6px;
        }
        .equipment-item .eq-image svg {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.12));
        }
        .equipment-item .eq-drop-zone {
            background: #dce8f2;
            border: 2px dashed #6a9ab8;
            border-radius: 12px;
            padding: 10px 12px;
            min-height: 40px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #4a7a8a;
            transition: 0.2s;
            font-weight: 500;
        }
        .equipment-item .eq-drop-zone.filled {
            border-color: #4CAF50;
            background: #e8f5e9;
            color: #1a4a2a;
        }
        .equipment-item .eq-drop-zone.drag-over {
            border-color: #ffb300;
            background: #fff8e1;
        }

        .drag-words-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 14px 0;
        }
        .drag-word {
            background: #d0e0ec;
            padding: 12px 24px;
            border-radius: 40px;
            border: 2px solid #6a9ab8;
            color: #0a2a3a;
            font-weight: 600;
            cursor: grab;
            user-select: none;
            transition: 0.15s;
            font-size: 1rem;
        }
        .drag-word:hover {
            background: #b8cfe0;
            transform: scale(1.03);
        }
        .drag-word.dragging {
            opacity: 0.4;
        }
        .drag-word.placed {
            opacity: 0.3;
            pointer-events: none;
            border-color: #8aacbf;
            background: #d0e0ec;
        }

        /* ---------- STATION 2: ДИСПЛЕЙ ---------- */
        .display-container {
            background: #0a1a2a;
            border-radius: 28px;
            padding: 20px 16px;
            border: 4px solid #4a8ab8;
            box-shadow: inset 0 0 40px #00224455, 0 4px 20px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .display-container .display-text {
            font-family: 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: #ff6b6b;
            letter-spacing: 4px;
            animation: blink 1s step-end infinite;
        }
        .display-container .display-text.success {
            color: #4fc3f7;
            animation: none;
        }

        .error-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 12px 0;
        }
        .error-panel .col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .error-panel .col-title {
            font-weight: 600;
            color: #0a2a3a;
            font-size: 0.8rem;
            padding-bottom: 3px;
            border-bottom: 2px solid #b0c8da;
        }
        .error-item {
            background: #dce8f2;
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid #b0c8da;
            color: #0a2a3a;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .error-item:hover {
            background: #c8dae8;
        }
        .error-item.selected {
            border-color: #ffb300;
            background: #fff8e1;
        }
        .error-item.matched {
            border-color: #4CAF50;
            background: #e8f5e9;
            cursor: default;
            opacity: 0.6;
        }
        .error-item.wrong {
            border-color: #e53935;
            background: #ffebee;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        .action-item {
            background: #dce8f2;
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid #b0c8da;
            color: #0a2a3a;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .action-item:hover {
            background: #c8dae8;
        }
        .action-item.selected-action {
            border-color: #ffb300;
            background: #fff8e1;
        }
        .action-item.matched-action {
            border-color: #4CAF50;
            background: #e8f5e9;
            cursor: default;
            opacity: 0.6;
        }
        .action-item.wrong-action {
            border-color: #e53935;
            background: #ffebee;
            animation: shake 0.4s ease;
        }

        /* ---------- STATION 3 & 4: МЕССЕНДЖЕР ---------- */
        .phone-real {
            background: #1a1a2e;
            border-radius: 40px;
            padding: 14px 10px 18px;
            max-width: 380px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 0 0 2px #2a2a4a;
            border: 1px solid #3a3a5a;
        }
        .phone-real .phone-notch {
            background: #0a0a1a;
            border-radius: 20px 20px 0 0;
            padding: 8px 14px 4px;
            display: flex;
            justify-content: space-between;
            color: #6a6a8a;
            font-size: 0.6rem;
        }
        .phone-real .phone-notch .notch-center {
            width: 60px;
            height: 18px;
            background: #0a0a1a;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            margin-top: -2px;
        }
        .phone-real .phone-screen {
            background: #0a0a1a;
            border-radius: 0 0 32px 32px;
            padding: 10px 8px 14px;
            min-height: 320px;
        }
        .phone-real .phone-screen .chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1a1a3a;
            color: #d0d0e8;
            font-size: 0.85rem;
        }
        .phone-real .phone-screen .chat-header .avatar {
            font-size: 1.6rem;
        }
        .phone-real .phone-screen .chat-header .name {
            font-weight: 600;
            color: #e8e8ff;
        }
        .phone-real .phone-screen .chat-header .status {
            font-size: 0.65rem;
            color: #4fc3f7;
            margin-left: auto;
        }
        .phone-real .phone-screen .chat-messages {
            padding: 8px 0;
            min-height: 180px;
            max-height: 260px;
            overflow-y: auto;
        }
        .phone-real .phone-screen .chat-messages .msg {
            margin: 3px 0;
            padding: 6px 12px;
            border-radius: 14px;
            max-width: 85%;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .phone-real .phone-screen .chat-messages .msg.boss {
            background: #1a2a4a;
            color: #c8d0ea;
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .phone-real .phone-screen .chat-messages .msg.me {
            background: #2a6a8a;
            color: #e8f4fc;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .phone-real .phone-screen .chat-messages .msg.system {
            background: transparent;
            color: #4a8a6a;
            text-align: center;
            font-size: 0.75rem;
            max-width: 100%;
        }
        .phone-real .phone-screen .chat-input {
            display: flex;
            gap: 6px;
            padding-top: 6px;
            border-top: 1px solid #1a1a3a;
        }
        .phone-real .phone-screen .chat-input input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid #2a2a5a;
            background: #12122a;
            color: #d0d8ec;
            font-size: 0.85rem;
            outline: none;
        }
        .phone-real .phone-screen .chat-input input:focus {
            border-color: #4a8ab8;
        }
        .phone-real .phone-screen .chat-input input:disabled {
            opacity: 0.5;
        }
        .phone-real .phone-screen .chat-input button {
            background: #2a6a8a;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .phone-real .phone-screen .chat-input button:hover {

    <script>
        // ================================================================
        //  ЗВУКИ
        // ================================================================
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.3) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { /* ignore */ }
        }

        function soundClick() { playTone(800, 0.08, 'sine', 0.2); }

        function soundCorrect() {
            playTone(523, 0.15, 'sine', 0.25);
            setTimeout(() => playTone(659, 0.15, 'sine', 0.25), 150);
            setTimeout(() => playTone(784, 0.2, 'sine', 0.3), 300);
        }

        function soundWrong() { playTone(300, 0.3, 'sawtooth', 0.15); }

        function soundLetter() {
            playTone(523, 0.12, 'sine', 0.25);
            setTimeout(() => playTone(659, 0.12, 'sine', 0.25), 120);
            setTimeout(() => playTone(784, 0.12, 'sine', 0.25), 240);
            setTimeout(() => playTone(1047, 0.3, 'sine', 0.3), 360);
        }

        function soundVictory() {
            const notes = [523, 587, 659, 784, 880, 988, 1047];
            notes.forEach((n, i) => setTimeout(() => playTone(n, 0.15, 'sine', 0.25), i * 120));
        }

        function soundCompressor() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 55;
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        //  ОЗВУЧКА (Web Speech API)
        // ================================================================
        let speechSynth = window.speechSynthesis;
        let speechUtterance = null;
        let isSpeaking = false;

        function speakText(text, callback) {
            if (!soundEnabled) {
                if (callback) callback();
                return;
            }
            try {
                if (speechSynth.speaking) {
                    speechSynth.cancel();
                }
                speechUtterance = new SpeechSynthesisUtterance(text);
                speechUtterance.lang = 'de-DE';
                speechUtterance.rate = 0.9;
                speechUtterance.pitch = 0.7;
                speechUtterance.volume = 1;
                const voices = speechSynth.getVoices();
                const maleVoice = voices.find(v => v.lang.startsWith('de') &&
                    (v.name.toLowerCase().includes('michael') ||
                        v.name.toLowerCase().includes('alex') ||
                        v.name.toLowerCase().includes('markus')));
                if (maleVoice) {
                    speechUtterance.voice = maleVoice;
                } else {
                    const deVoice = voices.find(v => v.lang.startsWith('de'));
                    if (deVoice) speechUtterance.voice = deVoice;
                }
                speechUtterance.onend = function() {
                    isSpeaking = false;
                    if (callback) callback();
                };
                speechUtterance.onerror = function(e) {
                    console.warn('Speech error:', e);
                    isSpeaking = false;
                    if (callback) callback();
                };
                isSpeaking = true;
                speechSynth.speak(speechUtterance);
            } catch (e) {
                console.warn('Speech synthesis error:', e);
                if (callback) callback();
            }
        }

        if (speechSynth) {
            speechSynth.getVoices();
            speechSynth.onvoiceschanged = () => { speechSynth.getVoices(); };
        }

        document.getElementById('soundToggle').addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            this.textContent = soundEnabled ? '🔊 Sound an' : '🔇 Sound aus';
            if (soundEnabled) {
                soundClick();
                setTimeout(() => soundCompressor(), 200);
                if (speechUtterance && isSpeaking) {
                    speechSynth.resume();
                }
            } else {

            storyContent.textContent = '';

            function typeChar() {
                if (index < storyFullText.length) {
                    const char = storyFullText[index];
                    storyContent.textContent += char;
                    index++;
                    if (storyContent.textContent.includes('E5')) {
                        const e5Index = storyContent.textContent.indexOf('E5');
                        if (e5Index >= 0) {
                            const html = storyContent.textContent.substring(0, e5Index) +
                                '<span class="highlight">E5</span>' +
                                storyContent.textContent.substring(e5Index + 2);
                            storyContent.innerHTML = html;
                        }
                    }
                    const delay = char === ' ' ? 50 : 35;
                    setTimeout(typeChar, delay);

        function initDragDropEquip() {
            const dragWords = document.querySelectorAll('.drag-word');
            const slots = document.querySelectorAll('.eq-drop-zone');
            if (!dragWords.length || !slots.length) return;

            dragWords.forEach(dw => {
                dw.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', dw.dataset.word);
                    dw.classList.add('dragging');
                });
                dw.addEventListener('dragend', () => dw.classList.remove('dragging'));
            });

            slots.forEach(slot => {
                slot.addEventListener('dragover', (e) => { e.preventDefault();
                    slot.classList.add('drag-over'); });
                slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    const word = e.dataTransfer.getData('text/plain');
                    const slotIdx = parseInt(slot.dataset.slot);
                    const expected = ['der Verdichter', 'der Kondensator', 'der Verdampfer', 'das Expansionsventil',
                        'die Rohrleitung'
                    ][slotIdx];
                    if (word === expected) {
                        soundCorrect();
                        document.getElementById(`slotText-${slotIdx}`).textContent = word;
                        slot.classList.add('filled');
                        document.querySelectorAll('.drag-word').forEach(d => {
                            if (d.dataset.word === word) d.classList.add('placed');
                        });
                        const allSlots = document.querySelectorAll('.eq-drop-zone');
                        let allFilled = true;
                        allSlots.forEach(s => { if (!s.classList.contains('filled')) allFilled = false; });
                        if (allFilled) {
                            completed[0] = true;
                            progress++;

        function initStation2() {
            st2State = { selectedErr: null, selectedAction: null, matched: [false, false, false], currentErrorIdx: 0 };
            const errItems = document.querySelectorAll('.error-item');
            const actionItems = document.querySelectorAll('.action-item');

            function updateDisplay() {
                const current = errorData[st2State.currentErrorIdx];
                document.getElementById('displayCode').textContent = current.code;
                document.getElementById('feedback-1').textContent =
                    `🔹 Fehler: ${current.display}. Wählen Sie die passende Lösung.`;
                document.getElementById('feedback-1').className = 'feedback-msg-blue';
            }

            function findNextError() {
                for (let i = 0; i < st2State.matched.length; i++) {
                    if (!st2State.matched[i]) return i;
                }
                return -1;
            }

            errItems.forEach(item => {
                item.addEventListener('click', function() {
                    soundClick();
                    if (this.classList.contains('matched')) return;
                    document.querySelectorAll('.error-item').forEach(e => e.classList.remove('selected'));
                    this.classList.add('selected');
                    st2State.selectedErr = parseInt(this.dataset.err);
                    const err = errorData[st2State.selectedErr];
                    document.getElementById('displayCode').textContent = err.code;
                    document.getElementById('feedback-1').textContent =
                        `🔹 Fehler: ${err.display}. Wählen Sie die passende Lösung.`;
                    document.getElementById('feedback-1').className = 'feedback-msg-blue';
                });
            });

            actionItems.forEach(item => {
                item.addEventListener('click', function() {
                    soundClick();
                    if (this.classList.contains('matched-action')) return;
                    const actionId = this.dataset.action;
                    const used = st2State.matched.some((m, i) => m && errorData[i].correct === actionId);
                    if (used) {
                        document.getElementById('feedback-1').textContent = '⚠️ Diese Lösung wurde bereits verwendet.';
                        document.getElementById('feedback-1').className = 'feedback-msg-blue error';
                        return;
                    }
                    if (st2State.selectedErr === null) {
                        document.getElementById('feedback-1').textContent = '⚠️ Wählen Sie zuerst einen Fehler aus.';
                        document.getElementById('feedback-1').className = 'feedback-msg-blue error';
                        return;
                    }
                    const errIdx = st2State.selectedErr;
                    if (st2State.matched[errIdx]) {
                        document.getElementById('feedback-1').textContent = '⚠️ Dieser Fehler ist schon zugeordnet.';
                        document.getElementById('feedback-1').className = 'feedback-msg-blue error';
                        return;
                    }
                    const currentCode = errorData[st2State.currentErrorIdx].code;
                    const selectedErrorCode = errorData[errIdx].code;
                    if (selectedErrorCode !== currentCode) {
                        soundWrong();
                        document.getElementById(`errItem-${errIdx}`).classList.add('wrong');
                        this.classList.add('wrong-action');
                        document.getElementById('feedback-1').textContent =
                            `❌ Falscher Fehler! Der aktuelle Code ist ${currentCode}. Wählen Sie den passenden Fehler.`;
                        document.getElementById('feedback-1').className = 'feedback-msg-blue error';
                        setTimeout(() => {
                            document.getElementById(`errItem-${errIdx}`).classList.remove('wrong');
                            this.classList.remove('wrong-action');
                            document.getElementById('feedback-1').className = 'feedback-msg-blue';
                            updateDisplay();
                        }, 1200);
                        return;
                    }
                    const correct = errorData[errIdx].correct;
                    if (actionId === correct) {
                        soundCorrect();
                        st2State.matched[errIdx] = true;
                        document.getElementById(`errItem-${errIdx}`).classList.add('matched');
                        document.getElementById(`errItem-${errIdx}`).classList.remove('selected');
                        document.getElementById(`action-${actionId}`).classList.add('matched-action');
                        document.getElementById('feedback-1').textContent = `✅ Fehler ${errIdx+1} richtig zugeordnet!`;
                        document.getElementById('feedback-1').className = 'feedback-msg-blue success';
                        st2State.selectedErr = null;
                        st2State.selectedAction = null;
                        document.querySelectorAll('.error-item').forEach(e => e.classList.remove('selected'));
                        document.querySelectorAll('.action-item').forEach(a => a.classList.remove('selected-action'));
                        const next = findNextError();
                        if (next !== -1) {
                            st2State.currentErrorIdx = next;
                            updateDisplay();
                        }
                        if (st2State.matched.every(v => v === true)) {
                            completed[1] = true;
                            progress++;
                            codeLetters[1] = stationsData[1].letter;
                            document.getElementById('feedback-1').textContent = '✅ Alle Fehler zugeordnet! ' + stationsData[1]
                                .letter + ' freigeschaltet!';
                            document.getElementById('feedback-1').className = 'feedback-msg-blue success';
                            document.getElementById('nextBtn-1').disabled = false;
                            document.getElementById('displayCode').textContent = '✅';
                            document.getElementById('displayCode').className = 'display-text success';
                            updateUI();
                            isWaitingForOverlay = true;
                            setTimeout(() => showLetterOverlay(stationsData[1].letter, 1), 400);
                        }
                    } else {
                        soundWrong();
                        document.getElementById(`action-${actionId}`).classList.add('wrong-action');
                        document.getElementById('feedback-1').textContent =
                            `❌ Falsche Lösung für Code ${currentCode}. Versuchen Sie es nochmal.`;
                        document.getElementById('feedback-1').className = 'feedback-msg-blue error';
                        setTimeout(() => {
                            document.getElementById(`action-${actionId}`).classList.remove('wrong-action');
                            document.getElementById('feedback-1').className = 'feedback-msg-blue';
                            updateDisplay();
                        }, 1200);
                    }
                });
            });
        }

        // ================================================================

        function showFinalSlide() {
            stationSlides.style.display = 'none';
            finalSlide.classList.remove('hidden');
            finalSlide.style.display = 'flex';
            slideWrapper.classList.add('final');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById('checkTranslationBtn').addEventListener('click', function() {
                const input = document.getElementById('translationInput');
                const val = input.value.trim().toLowerCase();
                const resultDiv = document.getElementById('translationResult');
                const valid = ['холод', 'холодно'];
                if (valid.includes(val)) {
                    resultDiv.textContent = '✅ Richtig!';
                    resultDiv.className = 'result-msg success';
                    soundCorrect();
                    showFinalCall();
                } else {
                    resultDiv.textContent = '❌ Falsch. Versuchen Sie es nochmal.';
                    resultDiv.className = 'result-msg error';
                    soundWrong();
                }
            });
        }

        let finalCallAnswered = false;
        let finalCallTimerValue = 10;
        let finalCallInterval = null;

        function showFinalCall() {
            const container = document.getElementById('finalCallContainer');
            container.classList.remove('hidden');
            container.style.display = 'block';

            const status = document.getElementById('finalCallStatus');
            const timer = document.getElementById('finalCallTimer');
            const answerBtnFinal = document.getElementById('finalAnswerBtn');

            finalCallTimerValue = 10;
            timer.textContent = '00:10';
            status.textContent = '📳 Klingelt ...';
            answerBtnFinal.disabled = false;

            finalCallInterval = setInterval(() => {
                finalCallTimerValue--;
                timer.textContent = `00:${String(finalCallTimerValue).padStart(2, '0')}`;
                if (finalCallTimerValue <= 5 && finalCallTimerValue > 0) {
                    status.textContent = '📞 Verbinde ...';
                }
                if (finalCallTimerValue === 0) {
                    clearInterval(finalCallInterval);
                    status.textContent = '⏰ Verpasst!';
                    answerBtnFinal.disabled = true;
                    showThanks();
                }
            }, 1000);

            answerBtnFinal.addEventListener('click', function() {
                if (finalCallAnswered) return;
                finalCallAnswered = true;
                clearInterval(finalCallInterval);
                status.textContent = '✅ Verbunden!';
                answerBtnFinal.disabled = true;
                soundClick();
                setTimeout(() => {
                    showThanks();
                }, 400);
            });
        }

        function showThanks() {
            const thanksText = document.getElementById('thanksText');
            thanksText.style.display = 'block';
            const content = document.getElementById('thanksContent');
            const cursor = document.getElementById('thanksCursor');

            const thanksMessage = 'Vielen Dank für Ihre schnelle Hilfe! Die Kühlung läuft wieder einwandfrei. Sie haben uns den Abend gerettet!';
            speakText(thanksMessage, () => {
                showPaymentNotification();
            });

            let index = 0;
            content.textContent = '';
            cursor.style.display = 'inline-block';

            function typeThanks() {
                if (index < thanksMessage.length) {
                    content.textContent += thanksMessage[index];
                    index++;
                    const delay = thanksMessage[index - 1] === ' ' ? 40 : 25;
                    setTimeout(typeThanks, delay);
                } else {
                    cursor.style.display = 'none';
                }
            }
            setTimeout(typeThanks, 300);
        }

        function showPaymentNotification() {
            const notif = document.getElementById('paymentNotification');
            notif.classList.add('show');
            soundVictory();
            setTimeout(() => {
                document.getElementById('victoryOverlay').classList.add('show');
                soundVictory();
            }, 3000);
        }

        // ================================================================
        //  RENDER DISPATCH
        // ================================================================
        function renderStation(index) {
            switch (index) {
                case 0:
                    renderStation1();
                    break;
                case 1:
                    renderStation2();
                    break;
                case 2:
                    renderStation3();
                    break;
                case 3:
                    renderStation4();
                    break;
                case 4:
                    renderStation5();
                    break;
                default:
                    break;
            }
        }

        function handleNext(index) {
            if (index === 4) return;
            if (!completed[index]) return;
            currentStation = index + 1;
            if (currentStation < 5) {
                soundClick();
                renderStation(currentStation);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ================================================================
        //  START
        // ================================================================
        startBtn.addEventListener('click', function() {
            soundClick();
            soundCompressor();
            legendSlide.classList.add('hidden');
            stationSlides.classList.remove('hidden');
            stationSlides.style.display = 'flex';
            currentStation = 0;
            st2State = { selectedErr: null, selectedAction: null, matched: [false, false, false], currentErrorIdx: 0 };
            st4State = { stage: 0, answer1: '', answer2: '' };
            renderStation(0);
            updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        updateUI();
        console.log('🧊 Kälteanlagen-Quest Final V5 geladen.');
    </script>
