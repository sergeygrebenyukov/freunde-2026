<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldener Herbst - Glueckskekse</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --bg-1: #f5b65b;
      --bg-2: #bf5f2a;
      --bg-3: #5d2d1f;
      --cookie-light: #f7d8a6;
      --cookie-mid: #e8b97f;
      --cookie-dark: #b97c3b;
      --paper: #fff6dd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 15% 20%, var(--bg-1), transparent 35%),
                  radial-gradient(circle at 80% 12%, #d47733, transparent 32%),
                  linear-gradient(160deg, var(--bg-2) 0%, var(--bg-3) 65%, #31140f 100%);
      color: #fffaf0;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 214, 153, 0.07), rgba(255, 255, 255, 0));
      animation: warmShift 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes warmShift {
      0% { opacity: 0.4; transform: translateX(-2%); }
      100% { opacity: 0.95; transform: translateX(2%); }
    }

    .leaf {
      position: fixed;
      top: -12vh;
      width: 20px;
      height: 14px;
      border-radius: 40% 60% 55% 45%;
      background: linear-gradient(140deg, #f9cf6a, #cb6f2f);
      filter: drop-shadow(0 6px 8px rgba(40, 14, 6, 0.25));
      transform-origin: center;
      animation: leafDrift linear infinite;
      opacity: 0.78;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes leafDrift {
      0% { transform: translate3d(0, -15vh, 0) rotate(0deg); }
      100% { transform: translate3d(var(--leaf-x, 18vw), 120vh, 0) rotate(540deg); }
    }

    main {
      position: relative;
      z-index: 2;
    }

    .cookie {
      position: relative;
      width: 92px;
      height: 92px;
      transform: translate3d(0, 0, 0) scale(1);
      transition: transform 650ms cubic-bezier(0.2, 0.95, 0.15, 1), opacity 400ms ease;
      will-change: transform;
    }

    .cookie:not(.is-broken):hover {
      transform: translateY(-4px) scale(1.03);
    }

    .cookie:focus-visible {
      outline: 2px solid #fff6dd;
      outline-offset: 4px;
    }

    .cookie-shell {
      position: absolute;
      inset: 0;
    }

    .half {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, var(--cookie-light), var(--cookie-mid) 63%, var(--cookie-dark));
      box-shadow: inset 0 2px 4px rgba(255, 247, 216, 0.35), inset 0 -10px 14px rgba(115, 61, 25, 0.36), 0 10px 18px rgba(34, 14, 7, 0.34);
      transition: transform 700ms cubic-bezier(0.2, 0.95, 0.15, 1), opacity 450ms ease;
    }

    .half-left {
      clip-path: polygon(0 0, 68% 0, 50% 50%, 68% 100%, 0 100%);
    }

    .half-right {
      clip-path: polygon(32% 0, 100% 0, 100% 100%, 32% 100%, 50% 50%);
    }

    .crack-line {
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, transparent 47.5%, rgba(117, 60, 27, 0.35) 48%, rgba(117, 60, 27, 0.35) 52%, transparent 52.5%);
      opacity: 0.7;
      transition: opacity 300ms ease;
      pointer-events: none;
    }

    .note {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 170px;
      min-height: 76px;
      padding: 10px 12px;
      border-radius: 8px;
      background: linear-gradient(180deg, #fffcf2, var(--paper));
      color: #6b3b1d;
      font-size: 0.76rem;
      line-height: 1.2;
      text-align: center;
      box-shadow: 0 8px 24px rgba(33, 16, 9, 0.35);
      transform: translate(-50%, -50%) scale(0.45) rotate(-7deg);
      opacity: 0;
      transition: transform 650ms cubic-bezier(0.2, 0.95, 0.15, 1), opacity 420ms ease;
      pointer-events: none;
    }

    .cookie.is-rising {
      transform: translate(var(--rise-x), var(--rise-y)) scale(1.4);
      z-index: 50;
    }

    .cookie.is-cracking .half-left {
      transform: translateX(-55px) rotate(-24deg);
    }

    .cookie.is-cracking .half-right {
      transform: translateX(55px) rotate(24deg);
    }

    .cookie.is-cracking .crack-line {
      opacity: 0;
    }

    .cookie.is-cracking .note {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-2deg);
    }

    .cookie.is-returning {
      transform: translate(0, 0) scale(1);
      z-index: 25;
    }

    .cookie.is-broken {
      cursor: not-allowed;
      opacity: 0.72;
      filter: saturate(0.8);
    }

    .cookie.is-broken .half-left {
      transform: translateX(-18px) rotate(-12deg);
      opacity: 0.78;
    }

    .cookie.is-broken .half-right {
      transform: translateX(18px) rotate(12deg);
      opacity: 0.78;
    }

    .cookie.is-broken .note {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4) rotate(-8deg);
    }

    .cookie.is-broken .crack-line {
      opacity: 0;
    }

    .cookie-count {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
      color: rgba(255, 242, 219, 0.88);
    }

    .latest {
      min-height: 4.8rem;
      color: #fff5de;
      text-shadow: 0 4px 12px rgba(45, 20, 9, 0.35);
      transition: opacity 320ms ease;
    }

    @media (max-width: 700px) {
      .cookie {
        width: 78px;
        height: 78px;
      }

      .cookie.is-rising {
        transform: translate(var(--rise-x), var(--rise-y)) scale(1.3);
      }

      .note {
        width: 142px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div id="leaves" aria-hidden="true"></div>

  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-6 pb-12 pt-10 md:px-10">
    <header class="text-center">
      <p class="text-sm tracking-[0.3em] text-amber-100/90">HERBSTWUNDER</p>
      <h1 class="mt-2 text-4xl font-semibold tracking-tight text-amber-50 md:text-6xl">Goldene Glueckskekse</h1>
      <p class="mx-auto mt-4 max-w-2xl text-base text-amber-50/90 md:text-lg">
        Klicke auf einen Keks, lass ihn aufspringen und entdecke eine Vorhersage aus der goldenen Jahreszeit.
      </p>
    </header>

    <section class="mt-8 text-center">
      <p class="cookie-count" id="cookieCount">Noch 15 Kekse geschlossen</p>
      <p class="latest mx-auto mt-3 max-w-3xl text-lg md:text-xl" id="latestPrediction">
        Waehle deinen ersten Keks und lies dein Herbstzeichen.
      </p>
    </section>

    <section class="mt-8 flex flex-1 items-start justify-center">
      <div id="cookieField" class="grid grid-cols-3 gap-6 sm:grid-cols-4 md:grid-cols-5" aria-label="Glueckskekse mit Vorhersagen"></div>
    </section>
  </main>

  <script>
    const predictions = [
      "Ein goldener Blattregen bringt dir in den naechsten Tagen eine frohe Nachricht.",
      "Du wirst einen stillen Herbstmorgen erleben, der dir eine klare Entscheidung schenkt.",
      "Ein Spaziergang durch raschelnde Blaetter fuehrt dich zu einer neuen Idee.",
      "Ein warmes Licht im Oktober zeigt dir, wem du wirklich vertrauen kannst.",
      "In dieser Saison oeffnet sich eine Tuer, hinter der lange erwartete Ruhe liegt.",
      "Ein zufaelliger Duft nach Zimt erinnert dich an ein Talent, das jetzt wachsen will.",
      "Der Wind des November bringt dir Mut fuer ein wichtiges Gespraech.",
      "Wenn die Sonne tief steht, findest du genau den Satz, den jemand hoeren muss.",
      "Bald wird ein kleines Herbstfest dir eine grosse Begegnung schenken.",
      "Eine alte Gewohnheit faellt wie ein trockenes Blatt und macht Platz fuer Leichtigkeit.",
      "Im goldenen Abendlicht erkennst du den naechsten richtigen Schritt.",
      "Ein freundliches Wort von dir wird in diesem Herbst ungeahnte Wirkung haben.",
      "Der erste kuehle Regen bringt dir eine Idee, die lange in dir gereift ist.",
      "Zwischen Kastanien und Blaettern findest du ein Zeichen fuer einen Neubeginn.",
      "Noch vor dem Winter erfuellt sich ein Wunsch, den du fast vergessen hast."
    ];

    const cookieField = document.getElementById("cookieField");
    const latestPrediction = document.getElementById("latestPrediction");
    const cookieCount = document.getElementById("cookieCount");
    const opened = new Set();
    let busy = false;

    function createCookie(index, text) {
      const button = document.createElement("button");
      button.className = "cookie";
      button.type = "button";
      button.dataset.index = String(index);
      button.setAttribute("aria-label", `Glueckskeks ${index + 1}`);

      const shell = document.createElement("div");
      shell.className = "cookie-shell";

      const left = document.createElement("span");
      left.className = "half half-left";

      const right = document.createElement("span");
      right.className = "half half-right";

      const crackLine = document.createElement("span");
      crackLine.className = "crack-line";

      const note = document.createElement("div");
      note.className = "note";
      note.textContent = text;

      shell.append(left, right, crackLine, note);
      button.appendChild(shell);
      button.addEventListener("click", () => crackCookie(button, text));
      return button;
    }

    function updateCount() {
      const remaining = predictions.length - opened.size;
      cookieCount.textContent = `Noch ${remaining} Kekse geschlossen`;
    }

    function crackCookie(cookie, text) {
      const index = Number(cookie.dataset.index);
      if (busy || opened.has(index)) return;

      busy = true;
      const rect = cookie.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const targetX = window.innerWidth / 2;
      const targetY = Math.max(190, window.innerHeight * 0.42);
      const riseX = targetX - cx;
      const riseY = targetY - cy;

      cookie.style.setProperty("--rise-x", `${riseX}px`);
      cookie.style.setProperty("--rise-y", `${riseY}px`);

      cookie.classList.add("is-rising");

      setTimeout(() => {
        cookie.classList.add("is-cracking");
        latestPrediction.style.opacity = "0.2";
      }, 620);

      setTimeout(() => {
        latestPrediction.textContent = text;
        latestPrediction.style.opacity = "1";
      }, 1080);

      setTimeout(() => {
        cookie.classList.remove("is-rising");
        cookie.classList.add("is-returning");
      }, 2500);

      setTimeout(() => {
        cookie.classList.remove("is-cracking", "is-returning");
        cookie.classList.add("is-broken");
        cookie.disabled = true;
        opened.add(index);
        updateCount();
        busy = false;
      }, 3200);
    }

    predictions.forEach((text, index) => {
      cookieField.appendChild(createCookie(index, text));
    });

    updateCount();

    const leavesContainer = document.getElementById("leaves");
    const leafCount = 14;
    for (let i = 0; i < leafCount; i += 1) {
      const leaf = document.createElement("span");
      leaf.className = "leaf";
      leaf.style.left = `${Math.random() * 100}vw`;
      leaf.style.animationDuration = `${8 + Math.random() * 9}s`;
      leaf.style.animationDelay = `${Math.random() * -12}s`;
      leaf.style.setProperty("--leaf-x", `${-14 + Math.random() * 28}vw`);
      leaf.style.opacity = `${0.45 + Math.random() * 0.4}`;
      leavesContainer.appendChild(leaf);
    }
  </script>
</body>
</html>
